<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Agent · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12161e;
    --panel-border: #1f2530;
    --text: #c7ccd6;
    --text-dim: #6b7280;
    --green: #00d9a3;
    --red: #ff4757;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 36px 32px;
    width: 320px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
  .brand h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    color: #e8eaef;
    letter-spacing: 0.02em;
  }
  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    background: #0a0d12;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    margin-bottom: 16px;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--green);
  }
  button {
    width: 100%;
    background: var(--green);
    color: #0a0d12;
    border: none;
    padding: 11px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  button:hover { opacity: 0.9; }
  .error {
    color: var(--red);
    font-size: 12px;
    margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="dot"></div>
    <h1>PATTERN AGENT</h1>
  </div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit">Enter</button>
  </form>
</div>
</body>
</html>
